server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # `expires` (et non add_header) pour le cache : add_header dans un `location`
    # annulerait les en-têtes de sécurité déclarés ici au niveau `server`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fichiers hachés par Vite : immuables.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Point d'entrée + PWA (service worker, manifeste) : toujours revalidés, sinon
    # un déploiement n'atteint jamais les navigateurs qui ont déjà l'ancienne version.
    location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
        expires -1;
        try_files $uri =404;
    }

    # SPA : toute route inconnue est résolue côté client par react-router.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
